<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地推商户监控</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #0f1117;
  color: #e2e8f0;
  min-height: 100vh;
}

.header {
  background: linear-gradient(135deg, #1a1d27 0%, #111318 100%);
  border-bottom: 1px solid #2d3748;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.header h1 {
  font-size: 20px;
  font-weight: 600;
  color: #f8fafc;
  display: flex;
  align-items: center;
  gap: 8px;
}

.header h1 span { font-size: 24px; }

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 13px;
  color: #94a3b8;
}

.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #10b981;
  display: inline-block;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.refresh-btn {
  background: #1e293b;
  border: 1px solid #334155;
  color: #e2e8f0;
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
}
.refresh-btn:hover { background: #334155; }

.filters {
  padding: 12px 24px;
  background: #1a1d27;
  border-bottom: 1px solid #1e293b;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.filter-btn {
  background: #1e293b;
  border: 1px solid #334155;
  color: #94a3b8;
  padding: 5px 12px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.2s;
}
.filter-btn:hover, .filter-btn.active {
  background: #3b82f6;
  border-color: #3b82f6;
  color: #fff;
}

.search-box {
  background: #1e293b;
  border: 1px solid #334155;
  color: #e2e8f0;
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 12px;
  width: 140px;
  outline: none;
}
.search-box:focus { border-color: #3b82f6; }

.summary-bar {
  padding: 12px 24px;
  background: #1e293b;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
  border-bottom: 1px solid #2d3748;
}

.summary-item {
  text-align: center;
}
.summary-item .label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
.summary-item .value { font-size: 18px; font-weight: 600; color: #f8fafc; margin-top: 2px; }
.summary-item .value.warn { color: #f59e0b; }
.summary-item .value.alert { color: #ef4444; }

.table-container {
  padding: 16px 24px;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

thead th {
  background: #1a1d27;
  color: #64748b;
  font-weight: 500;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 10px 12px;
  text-align: left;
  border-bottom: 1px solid #2d3748;
  white-space: nowrap;
  position: sticky;
  top: 0;
}

tbody tr {
  border-bottom: 1px solid #1e293b;
  transition: background 0.15s;
}
tbody tr:hover { background: #1a1d27; }

tbody td {
  padding: 10px 12px;
  color: #cbd5e1;
  white-space: nowrap;
}

.merchant-name {
  font-weight: 500;
  color: #f1f5f9;
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.balance { font-weight: 600; }
.balance.ok { color: #10b981; }
.balance.warn { color: #f59e0b; }
.balance.alert { color: #ef4444; }

.consume { color: #60a5fa; font-weight: 500; }

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
}
.badge-ok { background: #064e3b; color: #10b981; }
.badge-warn { background: #78350f; color: #f59e0b; }
.badge-alert { background: #7f1d1d; color: #ef4444; }

.no-data {
  text-align: center;
  padding: 60px;
  color: #475569;
  font-size: 14px;
}

.loading {
  text-align: center;
  padding: 60px;
  color: #475569;
}

.auto-refresh {
  font-size: 11px;
  color: #475569;
  display: flex;
  align-items: center;
  gap: 6px;
}
.progress-bar {
  width: 60px; height: 4px;
  background: #1e293b;
  border-radius: 2px;
  overflow: hidden;
}
.progress-bar .fill {
  height: 100%;
  background: #3b82f6;
  transition: width 1s linear;
}

/* 详情弹窗 */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.modal-overlay.show { display: flex; }

.modal {
  background: #1a1d27;
  border: 1px solid #2d3748;
  border-radius: 12px;
  width: 100%;
  max-width: 480px;
  overflow: hidden;
}

.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid #2d3748;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-header h2 { font-size: 16px; color: #f8fafc; }
.modal-close {
  background: none; border: none; color: #64748b;
  font-size: 20px; cursor: pointer; line-height: 1;
  padding: 4px 8px;
}
.modal-close:hover { color: #e2e8f0; }

.modal-body {
  padding: 20px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.metric-card {
  background: #111318;
  border: 1px solid #2d3748;
  border-radius: 8px;
  padding: 12px;
}
.metric-card .label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
.metric-card .value { font-size: 20px; font-weight: 600; color: #f8fafc; margin-top: 4px; }
.metric-card .sub { font-size: 11px; color: #475569; margin-top: 2px; }

.footer {
  text-align: center;
  padding: 16px;
  color: #334155;
  font-size: 11px;
}

/* 报警预留样式 */
.alert-section {
  display: none; /* 暂不启用 */
}
</style>
</head>
<body>

<div class="header">
  <h1>📊 本地推商户监控</h1>
  <div class="header-right">
    <div class="auto-refresh">
      <div class="progress-bar"><div class="fill" id="progressFill" style="width:100%"></div></div>
      <span id="countdown">30:00</span> 后自动刷新
    </div>
    <span id="updateTime">—</span>
    <span class="status-dot"></span>
    <span id="merchantCount">—</span>
    <button class="refresh-btn" onclick="fetchData()">🔄 刷新</button>
  </div>
</div>

<div class="filters">
  <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">全部 (13)</button>
  <button class="filter-btn" data-filter="warn" onclick="setFilter('warn')">⚠️ 余额不足</button>
  <button class="filter-btn" data-filter="high" onclick="setFilter('high')">🔥 高消耗</button>
  <input type="text" class="search-box" placeholder="🔍 搜索商户..." id="searchInput" oninput="doSearch()">
</div>

<div class="summary-bar" id="summaryBar">
  <div class="summary-item">
    <div class="label">商户总数</div>
    <div class="value" id="totalMerchants">—</div>
  </div>
  <div class="summary-item">
    <div class="label">账户总余额</div>
    <div class="value" id="totalBalance">—</div>
  </div>
  <div class="summary-item">
    <div class="label">今日总消耗</div>
    <div class="value" id="totalConsume">—</div>
  </div>
  <div class="summary-item">
    <div class="label">总转化数</div>
    <div class="value" id="totalConvert">—</div>
  </div>
  <div class="summary-item">
    <div class="label">平均转化成本</div>
    <div class="value" id="avgCost">—</div>
  </div>
</div>

<div class="table-container" id="tableContainer">
  <div class="loading" id="loadingState">加载中...</div>
  <table id="dataTable" style="display:none">
    <thead>
      <tr>
        <th>商户</th>
        <th>可用余额</th>
        <th>实时消耗</th>
        <th>短视频</th>
        <th>直播</th>
        <th>转化数</th>
        <th>转化成本</th>
        <th>更新时间</th>
        <th>状态</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<!-- 详情弹窗 -->
<div class="modal-overlay" id="detailModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">—</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="footer">
  数据来源：巨量引擎代理商后台 · 每30分钟自动更新 · 报警功能预留（暂未启用）
</div>

<script>
// ===== 配置 =====
const BITABLE_APP_TOKEN = "W6apbYhDjaQjDbs83K8cWb1hnce";
const BITABLE_TABLE_ID  = "tblgcjlG9IQEt8iT";
const BITABLE_APP_ID    = "cli_a976b9b729fa9bb3";
const BITABLE_APP_SECRET = "k0lyGolc88vm59YTHkBohcHmTJjcA5Ub";

const REFRESH_INTERVAL = 30 * 60; // 30分钟
let allData = [];
let currentFilter = "all";
let searchText = "";
let countdownTimer = null;
let refreshTimer = null;

// ===== 飞书 API =====
async function getFeishuToken() {
  const r = await fetch("https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ app_id: BITABLE_APP_ID, app_secret: BITABLE_APP_SECRET })
  });
  const d = await r.json();
  return d.tenant_access_token;
}

async function fetchData() {
  const el = document.getElementById("loadingState");
  el.style.display = "block";
  el.textContent = "从飞书加载数据...";

  try {
    const token = await getFeishuToken();
    const url = `https://open.feishu.cn/open-apis/bitable/v1/apps/${BITABLE_APP_TOKEN}/tables/${BITABLE_TABLE_ID}/records?page_size=100`;
    const r = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
    const d = await r.json();
    const records = d?.data?.items || [];

    allData = records.map(rec => {
      const f = rec.fields;
      return {
        name: f["商户名称"] || "—",
        balance: f["可用余额"] || 0,
        totalConsume: f["实时消耗"] || 0,
        shortVideo: f["消耗_短视频"] || 0,
        live: f["消耗_直播"] || 0,
        convert: f["转化数"] || 0,
        costPer: f["转化成本"] || 0,
        updateTime: f["更新时间"] ? formatTime(f["更新时间"]) : "—",
        updateMs: f["更新时间"] || 0,
      };
    });

    render();
    resetTimers();
    document.getElementById("updateTime").textContent = `更新: ${formatNow()}`;
  } catch(e) {
    document.getElementById("loadingState").textContent = "加载失败: " + e.message;
  }
}

function formatTime(ms) {
  if (!ms) return "—";
  const d = new Date(ms);
  return `${d.getHours().toString().padStart(2,"0")}:${d.getMinutes().toString().padStart(2,"0")}:${d.getSeconds().toString().padStart(2,"0")}`;
}

function formatNow() {
  const d = new Date();
  return `${d.getHours().toString().padStart(2,"0")}:${d.getMinutes().toString().padStart(2,"0")}:${d.getSeconds().toString().padStart(2,"0")}`;
}

function formatMoney(v) {
  if (v >= 10000) return "¥" + (v/10000).toFixed(1) + "万";
  if (v >= 1000) return "¥" + v.toFixed(0);
  return "¥" + v.toFixed(2);
}

function getBalanceClass(v) {
  if (v <= 0) return "alert";
  if (v < 100) return "warn";
  return "ok";
}

function getBadgeClass(v) {
  if (v <= 0) return "badge-alert";
  if (v < 100) return "badge-warn";
  return "badge-ok";
}

function getBadgeText(v) {
  if (v <= 0) return "⚠️ 余额耗尽";
  if (v < 100) return "⚠️ 余额不足";
  return "● 正常";
}

// ===== 筛选 =====
function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  document.querySelector(`[data-filter="${f}"]`).classList.add("active");
  render();
}

function doSearch() {
  searchText = document.getElementById("searchInput").value.trim().toLowerCase();
  render();
}

function getFiltered() {
  return allData.filter(item => {
    // filter
    if (currentFilter === "warn" && item.balance >= 100) return false;
    if (currentFilter === "high" && item.totalConsume < 200) return false;
    // search
    if (searchText && !item.name.toLowerCase().includes(searchText)) return false;
    return true;
  });
}

// ===== 渲染 =====
function render() {
  const data = getFiltered();

  // 显示表格
  document.getElementById("loadingState").style.display = "none";
  document.getElementById("dataTable").style.display = "";

  // 汇总
  const totalBalance = allData.reduce((s, i) => s + (i.balance || 0), 0);
  const totalConsume = allData.reduce((s, i) => s + (i.totalConsume || 0), 0);
  const totalConvert = allData.reduce((s, i) => s + (i.convert || 0), 0);
  const avgCost = totalConvert > 0 ? totalConsume / totalConvert : 0;

  document.getElementById("totalMerchants").textContent = allData.length;
  document.getElementById("totalBalance").textContent = formatMoney(totalBalance);
  document.getElementById("totalConsume").textContent = formatMoney(totalConsume);
  document.getElementById("totalConvert").textContent = totalConvert;
  document.getElementById("avgCost").textContent = totalConvert > 0 ? "¥" + avgCost.toFixed(1) : "—";

  // 更新筛选按钮数量
  const warnCount = allData.filter(i => i.balance < 100).length;
  const highCount = allData.filter(i => i.totalConsume >= 200).length;
  document.querySelector("[data-filter='warn']").textContent = `⚠️ 余额不足 (${warnCount})`;
  document.querySelector("[data-filter='high']").textContent = `🔥 高消耗 (${highCount})`;

  document.getElementById("merchantCount").textContent = `${data.length} 商户`;

  // 表格行
  const tbody = document.getElementById("tableBody");
  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" class="no-data">无匹配数据</td></tr>';
    return;
  }

  tbody.innerHTML = data.map(item => {
    const bc = getBalanceClass(item.balance);
    return `<tr onclick="showDetail('${item.name}')" style="cursor:pointer">
      <td class="merchant-name">${item.name}</td>
      <td class="balance ${bc}">${formatMoney(item.balance)}</td>
      <td class="consume">${formatMoney(item.totalConsume)}</td>
      <td>${item.shortVideo > 0 ? formatMoney(item.shortVideo) : '—'}</td>
      <td>${item.live > 0 ? formatMoney(item.live) : '—'}</td>
      <td>${item.convert > 0 ? item.convert : '—'}</td>
      <td>${item.costPer > 0 ? '¥' + item.costPer.toFixed(1) : '—'}</td>
      <td style="color:#475569;font-size:12px">${item.updateTime}</td>
      <td><span class="badge ${getBadgeClass(item.balance)}">${getBadgeText(item.balance)}</span></td>
    </tr>`;
  }).join("");
}

function showDetail(name) {
  const item = allData.find(i => i.name === name);
  if (!item) return;
  document.getElementById("modalTitle").textContent = item.name;
  document.getElementById("modalBody").innerHTML = `
    <div class="metric-card">
      <div class="label">可用余额</div>
      <div class="value" style="color:${item.balance<100?'#f59e0b':'#10b981'}">${formatMoney(item.balance)}</div>
    </div>
    <div class="metric-card">
      <div class="label">实时消耗</div>
      <div class="value">${formatMoney(item.totalConsume)}</div>
      <div class="sub">更新时间 ${item.updateTime}</div>
    </div>
    <div class="metric-card">
      <div class="label">短视频消耗</div>
      <div class="value">${item.shortVideo > 0 ? formatMoney(item.shortVideo) : '—'}</div>
    </div>
    <div class="metric-card">
      <div class="label">直播消耗</div>
      <div class="value">${item.live > 0 ? formatMoney(item.live) : '—'}</div>
    </div>
    <div class="metric-card">
      <div class="label">转化数</div>
      <div class="value">${item.convert > 0 ? item.convert : 0}</div>
    </div>
    <div class="metric-card">
      <div class="label">转化成本</div>
      <div class="value">${item.costPer > 0 ? '¥' + item.costPer.toFixed(1) : '—'}</div>
    </div>
  `;
  document.getElementById("detailModal").classList.add("show");
}

function closeModal() {
  document.getElementById("detailModal").classList.remove("show");
}

// ===== 定时器 =====
function resetTimers() {
  clearInterval(countdownTimer);
  clearTimeout(refreshTimer);

  let remaining = REFRESH_INTERVAL;
  const progressFill = document.getElementById("progressFill");
  const countdownEl = document.getElementById("countdown");

  countdownTimer = setInterval(() => {
    remaining -= 1;
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    countdownEl.textContent = `${m}:${s.toString().padStart(2,"0")}`;
    progressFill.style.width = (remaining / REFRESH_INTERVAL * 100) + "%";
    if (remaining <= 0) clearInterval(countdownTimer);
  }, 1000);

  refreshTimer = setTimeout(() => fetchData(), REFRESH_INTERVAL * 1000);
}

// ===== 启动 =====
fetchData();
</script>
</body>
</html>
