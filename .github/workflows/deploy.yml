name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths: ['dashboard.html']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dashboard.html
          sparse-checkout-cone-mode: false

      - name: Deploy to Cloudflare Pages
        run: |
          npm install -g wrangler
          echo '${{ secrets.CLOUDFLARE_API_TOKEN }}' | wrangler login --token
          wrangler pages deploy . --project-name=consumption-dashboard --commit-hash="${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}